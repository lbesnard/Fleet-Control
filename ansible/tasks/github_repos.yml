- name: create github directory
  become: yes
  become_user: "{{user}}"
  file:
    path: "{{github_repo_dir}}"
    state: directory
    mode: 0775

- name: clone GitHub repos
  become: yes
  become_user: "{{user}}"
  git:
    repo: "{{repo.url}}"
    dest: "{{github_repo_dir}}/{{repo.name}}"
    accept_hostkey: yes
    track_submodules: yes
    #depth: 1
    clone: yes
    update: no
  loop_control:
    loop_var: repo
    label: "{{ repo.name }}"
  loop:
    - { url: "{{repo_ml_course}}", name: BuildingMachineLearningSystemsWithPython }
    - { url: "{{repo_Fleet_Control}}", name: Fleet-Control }
    - { url: "{{repo_imos_user_code_library}}", name: imos-user-code-library }
    - { url: "{{repo_keepass_rofi}}", name: rofi-keepassxc }
  ignore_errors: true
