---
# Task file included from system.yml (root via play-level become)
- name: Install dnsmasq
  apt:
    name: dnsmasq
    state: present
    update_cache: yes

- name: Configure dnsmasq
  copy:
    dest: /etc/dnsmasq.conf
    content: |
      # General Settings
      interface=lo
      bind-interfaces

      # Local Mappings
      address=/beefunk.lan/100.107.210.10
      address=/beefunk.home/100.107.210.10
      address=/beefunk.local/100.107.210.10

      # Upstream Internet
      server=8.8.8.8
      server=1.1.1.1
      no-resolv

      # Debugging for the future
      log-queries
      log-facility=/var/log/dnsmasq.log
    owner: root
    group: root
    mode: "0644"
  register: dnsmasq_conf

- name: Configure systemd-resolved to use local dnsmasq
  ini_file:
    path: /etc/systemd/resolved.conf
    section: Resolve
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: yes
  loop:
    - { option: "DNS", value: "127.0.0.1" }
    - { option: "Domains", value: "~." }
  register: resolved_conf

- name: Restart dnsmasq
  service:
    name: dnsmasq
    state: restarted
  when: dnsmasq_conf is changed

- name: Restart systemd-resolved
  service:
    name: systemd-resolved
    state: restarted
  when: resolved_conf is changed
