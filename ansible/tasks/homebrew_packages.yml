# Upgrading the brew ansible while it is running deletes its own files
# mid-play (lookup/action plugins vanish). Pin it; upgrade manually with
# `brew unpin ansible && brew upgrade ansible` outside of a playbook run.
- name: Pin brew ansible so upgrade_all cannot replace the running install
  command: /home/linuxbrew/.linuxbrew/bin/brew pin ansible
  become: false
  changed_when: false
  failed_when: false

# Brew ignores formulae from untrusted taps (and warns on every upgrade).
# Trust only the specific formulae we use. Errors are ignored on a fresh
# install where the taps are not yet present.
- name: Trust third-party tap formulae
  command: "/home/linuxbrew/.linuxbrew/bin/brew trust --formula {{ formula }}"
  loop_control:
    loop_var: formula
  loop:
    - fernandotcl/fernandotcl/monkeys-audio
    - jstkdng/programs/ueberzugpp
  become: false
  changed_when: false
  failed_when: false

# icu4c@75 is an old versioned formula (ICU library) that Homebrew disabled on
# 2025-10-24. If it is still installed, `brew upgrade` aborts trying to fetch
# it. Nothing installed depends on it, so remove it before upgrading.
# No-op when it is not installed.
- name: Remove disabled versioned formula icu4c@75
  command: "/home/linuxbrew/.linuxbrew/bin/brew uninstall --ignore-dependencies icu4c@75"
  become: false
  register: brew_icu_removal
  changed_when: "'Uninstalling' in brew_icu_removal.stdout"
  failed_when: false

- name: Update homebrew and upgrade all packages
  homebrew:
    path: "/home/linuxbrew/.linuxbrew/bin:/home/{{ ansible_user }}/.linuxbrew/bin"
    update_homebrew: yes
    upgrade_all: yes
  become: false
  become_user: "{{ ansible_user }}"
  ignore_errors: yes

- name: "brew install packages"
  become: false
  become_user: "{{ ansible_user }}"
  homebrew:
    path: "/home/linuxbrew/.linuxbrew/bin:/home/{{ ansible_user }}/.linuxbrew/bin"
    name: "{{ item }}"
    state: present # Ensure that the package is present
  loop:
    - cmake
    - gcc
    - ruby
    - ruby-install
    - act # github action
    - angle-grinder
    - ansible
    - ansible-lint
    - autojump
    - awscli
    - bat
    - btop
    - coreutils
    - curl
    - croc # send files p2p
    - dfc
    - diff-so-fancy
    - dust
    - eza
    - fd
    - fpp
    - freetype # for python matplotlib
    - fzf
    - gcc
    - git
    - git-delta
    - git-extras
    - gitui
    - gh # github cli
    - glow
    - grc
    - hexyl
    - htop
    - httpie
    - hugo
    - hub
    - lazygit
    - lazydocker
    - lf # ranger clone
    - lnav
    - lsd
    - mdcat
    - midnight-commander
    - mycli
    - ncdu
    - nvim
    - node
    - openssh
    - p7zip
    - pgcli
    - poppler
    - pyenv
    - pyenv-virtualenv
    - python@3.11
    - ranger
    - rbenv
    - rclone
    - ripgrep
    - sad
    - sk
    - starship
    - task
    - terminal-browser
    - termshark
    - the_silver_searcher
    - thefuck
    - tig
    - tldr
    - tmux
    - tree
    - urlview
    - vim
    - viu
    - wifitui
    - whosthere
    - xclip
    - yazi
    - yt-dlp
    - yq
    - zsh
    - zoxide
    - jstkdng/programs/ueberzugpp # used for image preview by yazi
  ignore_errors: yes

- name: "homebrew add tap monkeys-audio"
  shell: "[[ -f /home/linuxbrew/.linuxbrew/bin/brew ]] && /home/linuxbrew/.linuxbrew/bin/brew tap fernandotcl/homebrew-fernandotcl || ([[ -f /home/{{ ansible_user }}/.linuxbrew/bin/brew ]] && /home/{{ ansible_user }}/.linuxbrew/bin/brew tap fernandotcl/homebrew-fernandotcl)"
  args:
    executable: /bin/bash
  become: false
  become_user: "{{ ansible_user }}"
  ignore_errors: yes

- name: "homebrew monkeys-audio"
  homebrew:
    path: "/home/linuxbrew/.linuxbrew/bin:/home/{{ ansible_user }}/.linuxbrew/bin"
    name: [monkeys-audio]
    state: present
  become: false
  become_user: "{{ ansible_user }}"
  ignore_errors: yes
